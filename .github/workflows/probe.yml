name: Probe sources

# Run by hand. Tries each candidate in probe_targets.json and reports what can be read automatically.
# Changes nothing in the job data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe
        run: python probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe_report
          path: probe_report.*
