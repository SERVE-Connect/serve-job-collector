name: Daily job collector

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST every day
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect jobs
        run: python collector.py
      - name: Save results
        run: |
          git config user.name "serve-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Daily job data $(date -u +%F)"
          git push
